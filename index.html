<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>QR ABD | المنصة الشاملة</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
    <div id="toast-container"></div>

    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="glass-sidebar" id="sidebar">
            <div class="brand-area">
                <span class="logo-text">QR<span class="highlight">ABD</span></span>
                <span class="version-tag">V7 (Ultimate)</span>
                <!-- Mobile Toggle -->
                <button class="mobile-close" id="closeSidebar">✕</button>
            </div>

            <div class="controls-scroll">

                <!-- 0. Quick Templates -->
                <div class="control-group">
                    <h3>قوالب جاهزة</h3>
                    <div class="templates-grid">
                        <button class="tpl-btn" data-tpl="default">افتراضي ⚪</button>
                        <button class="tpl-btn" data-tpl="social">سوشيال 🔵</button>
                        <button class="tpl-btn" data-tpl="neon">نيون 🔮</button>
                        <button class="tpl-btn" data-tpl="gold">ذهبي 👑</button>
                        <button class="tpl-btn" data-tpl="matrix">ماتركس 🟢</button>
                        <button class="tpl-btn" data-tpl="love">حب ❤️</button>
                        <button class="tpl-btn" data-tpl="sunset">غروب 🌅</button>
                        <button class="tpl-btn" data-tpl="corporate">رسمي 🏢</button>
                    </div>
                </div>

                <!-- 1. Content Tabs -->
                <div class="control-group">
                    <h3>نوع المحتوى</h3>
                    <div class="tabs-header">
                        <button class="tab-btn active" data-tab="url">رابط 🔗</button>
                        <button class="tab-btn" data-tab="text">نص 📝</button>
                        <button class="tab-btn" data-tab="wifi">Wi-Fi 📶</button>
                        <button class="tab-btn" data-tab="vcard">أنشئ 📇</button>
                        <button class="tab-btn" data-tab="whatsapp">واتساب 💬</button>
                        <button class="tab-btn" data-tab="email">إيميل 📧</button>
                        <button class="tab-btn" data-tab="sms">SMS 📩</button>
                        <button class="tab-btn" data-tab="event">حدث 📅</button>
                        <button class="tab-btn" data-tab="location">موقع 📍</button>
                    </div>

                    <!-- URL Input -->
                    <div class="tab-content active" id="tab-url">
                        <div class="modern-input">
                            <input type="text" id="qrText" placeholder="https://..." autocomplete="off">
                            <i class="input-icon">🔗</i>
                        </div>
                    </div>

                    <!-- Wifi Input -->
                    <div class="tab-content" id="tab-wifi">
                        <div class="modern-input mb-2">
                            <input type="text" id="wifiSSID" placeholder="اسم الشبكة (SSID)">
                            <i class="input-icon">📡</i>
                        </div>
                        <div class="modern-input mb-2">
                            <input type="text" id="wifiPass" placeholder="كلمة المرور">
                            <i class="input-icon">🔑</i>
                        </div>
                        <select id="wifiEnc" class="modern-select">
                            <option value="WPA">WPA/WPA2</option>
                            <option value="WEP">WEP</option>
                            <option value="nopass">بدون رقم سري</option>
                        </select>
                    </div>

                    <!-- VCard Input -->
                    <div class="tab-content" id="tab-vcard">
                        <div class="modern-input mb-2"><input type="text" id="vcName" placeholder="الاسم الكامل"></div>
                        <div class="modern-input mb-2"><input type="text" id="vcPhone" placeholder="رقم الهاتف"></div>
                        <div class="modern-input mb-2"><input type="email" id="vcEmail" placeholder="البريد الإلكتروني">
                        </div>
                        <div class="modern-input"><input type="text" id="vcOrg" placeholder="الشركة / الوصف"></div>
                    </div>

                    <!-- WhatsApp Input -->
                    <div class="tab-content" id="tab-whatsapp">
                        <div class="modern-input mb-2">
                            <input type="text" id="waPhone" placeholder="رقم الهاتف (مع المفتاح الدولي)">
                            <i class="input-icon">📞</i>
                        </div>
                        <div class="modern-input">
                            <input type="text" id="waMsg" placeholder="الرسالة الجاهزة...">
                            <i class="input-icon">📝</i>
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div class="tab-content" id="tab-email">
                        <div class="modern-input mb-2">
                            <input type="email" id="mailTo" placeholder="البريد الإلكتروني للمستلم">
                            <i class="input-icon">👤</i>
                        </div>
                        <div class="modern-input mb-2">
                            <input type="text" id="mailSub" placeholder="الموضوع">
                            <i class="input-icon">📌</i>
                        </div>
                        <div class="modern-input">
                            <input type="text" id="mailBody" placeholder="محتوى الرسالة">
                            <i class="input-icon">✉️</i>
                        </div>
                    </div>

                    <!-- SMS Input -->
                    <div class="tab-content" id="tab-sms">
                        <div class="modern-input mb-2">
                            <input type="text" id="smsPhone" placeholder="رقم الهاتف">
                            <i class="input-icon">📱</i>
                        </div>
                        <div class="modern-input">
                            <input type="text" id="smsMsg" placeholder="محتوى الرسالة">
                            <i class="input-icon">💬</i>
                        </div>
                    </div>

                    <!-- Text Input -->
                    <div class="tab-content" id="tab-text">
                        <div class="modern-input">
                            <textarea id="plainText" class="modern-input" rows="4" placeholder="اكتب أي نص هنا..."
                                style="width:100%; padding:10px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.12); border-radius:8px; color:white; font-family:inherit;"></textarea>
                        </div>
                    </div>

                    <!-- Event Input -->
                    <div class="tab-content" id="tab-event">
                        <div class="modern-input mb-2"><input type="text" id="evtTitle" placeholder="عنوان الحدث"></div>
                        <div class="modern-input mb-2"><input type="text" id="evtLoc" placeholder="المكان"></div>
                        <div class="input-row" style="display:flex; gap:10px; margin-bottom:8px">
                            <input type="datetime-local" id="evtStart" class="modern-input" style="flex:1">
                            <input type="datetime-local" id="evtEnd" class="modern-input" style="flex:1">
                        </div>
                    </div>

                    <!-- Location Input -->
                    <div class="tab-content" id="tab-location">
                        <div class="modern-input mb-2">
                            <input type="text" id="geoLat" placeholder="خط العرض (Latitude)">
                        </div>
                        <div class="modern-input mb-2">
                            <input type="text" id="geoLon" placeholder="خط الطول (Longitude)">
                        </div>
                        <button class="btn-mini" id="locateBtn" style="width:100%; margin-bottom:10px">📍 تحديد موقعي
                            الحالي</button>
                    </div>
                </div>


                <!-- 3. Colors -->
                <div class="control-group">
                    <h3>الألوان</h3>
                    <div class="color-row">
                        <span class="label-tiny">Primary</span>
                        <div class="pickers-mini">
                            <input type="color" id="color1" value="#000000">
                            <input type="range" id="alpha1" min="0" max="1" step="0.01" value="1" class="mini-slider">
                        </div>
                    </div>

                    <div class="color-row toggle-row-mini">
                        <label class="check-label"><input type="checkbox" id="useGradient"> تدرج</label>
                        <div class="pickers-mini hidden" id="color2Wrapper">
                            <input type="color" id="color2" value="#06b6d4">
                            <input type="range" id="alpha2" min="0" max="1" step="0.01" value="1" class="mini-slider">
                        </div>
                    </div>

                    <div class="color-row">
                        <span class="label-tiny">Background</span>
                        <div class="pickers-mini">
                            <input type="color" id="bg" value="#ffffff">
                            <input type="range" id="alphaBg" min="0" max="1" step="0.01" value="1" class="mini-slider">
                        </div>
                    </div>
                    <div class="color-row">
                        <span class="label-tiny">Eyes</span>
                        <div class="pickers-mini">
                            <input type="color" id="eyeColor" value="#000000">
                            <input type="range" id="alphaEye" min="0" max="1" step="0.01" value="1" class="mini-slider">
                        </div>
                    </div>
                </div>

                <!-- 4. Design -->
                <div class="control-group">
                    <h3>التصميم</h3>
                    <div class="style-grid compact">
                        <div class="style-box active" data-style="square" data-target="shape">⬛</div>
                        <div class="style-box" data-style="dots" data-target="shape">●</div>
                        <div class="style-box" data-style="round" data-target="shape">⚪</div>
                    </div>
                    <div class="style-grid compact" style="margin-top:5px">
                        <div class="style-box active" data-style="square" data-target="eye">🔲</div>
                        <div class="style-box" data-style="circle" data-target="eye">⭕</div>
                        <div class="style-box" data-style="rounded" data-target="eye">▢</div>
                    </div>
                </div>

                <!-- Logo -->
                <div class="control-group">
                    <label class="btn-upload compact">
                        <input type="file" id="logoInput" hidden>
                        <span>رفع شعار +</span>
                    </label>
                </div>

                <!-- Generate -->
                <button id="generateBtn" class="btn-main">توليد ⚡</button>
            </div>
        </aside>

        <!-- PREVIEW STAGE -->
        <main class="preview-stage">
            <button class="mobile-menu-btn" id="openSidebar">⚙️ إعدادات</button>
            <button class="history-btn" id="openHistory">📜 السجل</button>

            <div class="bg-fx"></div>

            <div class="preview-card" id="resultCard">
                <div class="loader-overlay" id="loadingSpinner">
                    <div class="spinner"></div>
                </div>
                <div class="canvas-holder" id="qrcodeWrapper"></div>

                <div class="download-bar">
                    <select id="formatSelect" class="format-select">
                        <option value="png">PNG</option>
                        <option value="jpg">JPG</option>
                        <option value="webp">WEBP</option>
                        <option value="svg">SVG (Vector)</option>
                    </select>
                    <button class="btn-download" id="downloadBtn">تحميل ⬇️</button>
                </div>
                <button class="btn-reset" id="resetBtn">جديد ↻</button>
            </div>

            <div class="welcome-msg" id="placeholder">
                <h1>QR ABD</h1>
                <p>المنصة المتكاملة.</p>
            </div>
        </main>

        <!-- HISTORY MODAL -->
        <div class="modal hidden" id="historyModal">
            <div class="modal-content">
                <h3>سجل العمليات</h3>
                <ul id="historyList"></ul>
                <button class="btn-mini" id="closeHistory" style="margin-top:10px; width:100%">إغلاق</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW Registered', reg))
                .catch(err => console.log('SW Error', err));
        }
    </script>
</body>

</html>
